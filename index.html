<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b85d22"><title>江戸時代100問チャレンジ｜中学社会</title>
<style>
:root{--orange:#b85d22;--deep:#783a16;--ink:#2e261f;--muted:#76695f;--green:#27845d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#f5e4d4,#fffaf4 45%,#f4e8db);color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;min-height:100svh}
main{max-width:620px;margin:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));min-height:100svh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px;gap:8px}.brand{font-weight:800;color:var(--deep)}.pill{font-size:12px;padding:6px 10px;border-radius:99px;background:#f0d5c0;color:var(--deep);font-weight:700}
h1{font-size:clamp(24px,6vw,34px);line-height:1.25;margin:8px 0 6px}.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
.stats{display:flex;justify-content:space-between;align-items:end;margin:0 0 9px}.count{font-weight:800;font-size:23px}.count small{font-size:13px;color:var(--muted);font-weight:600}.mini{font-size:12px;color:var(--muted)}
.track{height:8px;background:#ead8c9;border-radius:99px;overflow:hidden;margin-bottom:18px}.bar{height:100%;width:0;background:var(--orange);transition:width .2s}
.card{background:rgba(255,255,255,.92);border:1px solid #ead8c9;border-radius:24px;padding:22px 20px;box-shadow:0 10px 30px #5d33151a}.kicker{font-size:12px;color:var(--orange);font-weight:800;letter-spacing:.08em}
.question{font-size:clamp(23px,5.8vw,31px);font-weight:800;line-height:1.55;min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 0}
.answer-area{margin-top:14px;background:#fff;border:1px solid #ead8c9;border-radius:22px;padding:18px;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center}
.answer-label{font-size:12px;color:var(--muted);font-weight:700}.answer{font-size:clamp(22px,5.5vw,29px);font-weight:850;color:var(--green);line-height:1.4}
button{font:inherit;border:0;border-radius:16px;padding:16px 14px;font-weight:800;cursor:pointer;min-height:54px}.primary{background:var(--orange);color:white;box-shadow:0 5px 0 var(--deep)}.secondary{background:#f4e6da;color:var(--deep)}.success{background:#e1f1e8;color:#176744}.review{background:#f8e9d9;color:#8a4a20}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.next{width:100%;margin-top:12px}.hidden{display:none!important}footer{margin-top:auto;padding-top:20px;text-align:center;color:var(--muted);font-size:11px}
.result{font-size:34px;font-weight:900;text-align:center;color:var(--deep);margin:8px}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.result-grid div{background:#fff;border-radius:12px;padding:12px;text-align:center}.result-grid b{display:block;font-size:23px}
.top-actions{display:flex;justify-content:space-between;margin-top:14px}.top-actions button{min-height:42px;padding:8px 12px;font-size:12px}button:disabled{opacity:.4;cursor:default}
@media(min-height:800px){.question{min-height:220px}.answer-area{min-height:170px}}
</style></head><body><main>
<header><div class="brand">📚 中学社会｜歴史</div><div class="pill">教科書範囲・全100問</div></header>
<section id="start"><h1>江戸時代<br>100問チャレンジ</h1><p class="sub">問題を読んで答えを考えよう。タップすると答えが表示されます。</p>
<div class="card"><div class="kicker">ONE QUESTION / ONE ANSWER</div><div class="question" style="min-height:120px">江戸時代の重要語句・人物・できごとをマスターしよう！</div><button class="primary" style="width:100%" id="begin">学習をスタート</button></div>
<p class="sub" style="margin-top:16px">全100問・スマホ対応・ブラウザで利用できます。</p></section>
<section id="quiz" class="hidden"><div class="stats"><div class="count"><span id="num">1</span><small> / 100 問</small></div><div class="mini">覚えた <b id="knownCount">0</b>　復習 <b id="reviewCount">0</b></div></div>
<div class="track"><div class="bar" id="bar"></div></div><div class="card"><div class="kicker">江戸時代・一問一答</div><div class="question" id="question"></div></div>
<div class="answer-area"><div class="answer-label">答え</div><div id="answer" class="answer hidden"></div><button id="show" class="primary">答えを見る</button>
<div id="mark" class="actions hidden"><button class="success" id="remember">✓ 覚えた</button><button class="review" id="again">↻ まだ不安</button></div></div>
<button class="secondary next hidden" id="next">次の問題へ →</button><div class="top-actions"><button class="secondary" id="prev">← 前の問題</button><button class="secondary" id="restart">最初から</button></div></section>
<section id="finish" class="hidden"><div class="card"><div class="kicker">COMPLETE!</div><h1 style="text-align:center">100問終了！</h1><div class="result" id="score">0 / 100</div><p style="text-align:center;color:var(--muted)">「覚えた」と記録した問題数です。</p>
<div class="result-grid"><div><b id="knownFinal">0</b><span>覚えた</span></div><div><b id="reviewFinal">0</b><span>復習する</span></div></div><button class="primary next" id="retry">もう一度挑戦する</button></div></section>
<footer>江戸時代100問チャレンジ｜中学社会</footer></main>
<script>
const questions=[["江戸幕府を開いた人物は誰ですか。", "徳川家康"], ["1600年、徳川家康が石田三成らに勝利した戦いは何ですか。", "関ヶ原の戦い"], ["徳川家康が征夷大将軍に任命されたのは何年ですか。", "1603年"], ["徳川家康が征夷大将軍に任命され、開いた幕府は何ですか。", "江戸幕府"], ["将軍と大名が土地と人民を支配する仕組みを何といいますか。", "幕藩体制"], ["徳川氏一門の大名を何といいますか。", "親藩"], ["関ヶ原の戦い以前から徳川氏に従っていた大名を何といいますか。", "譜代大名"], ["関ヶ原の戦い前後に徳川氏に従った大名を何といいますか。", "外様大名"], ["大名が許可なく城を修理したり、無断で縁組したりすることを禁じた法令は何ですか。", "武家諸法度"], ["大名に領地と江戸を往復させた制度は何ですか。", "参勤交代"], ["天皇や公家の行動などを定めた法律は何ですか。", "禁中並公家諸法度"], ["幕府が直接支配した土地を何といいますか。", "幕領（天領）"], ["1614年に始まった、豊臣氏と徳川氏の戦いのうち、冬に起こったものは何ですか。", "大坂冬の陣"], ["1615年、豊臣氏が滅亡するきっかけとなった戦いは何ですか。", "大坂夏の陣"], ["海外渡航を許可するために幕府が発行した証明書は何ですか。", "朱印状"], ["朱印状を持った船による貿易を何といいますか。", "朱印船貿易"], ["朱印船貿易で日本人が移住し、東南アジアにつくった町を何といいますか。", "日本町"], ["江戸幕府がキリスト教を禁止したことを何といいますか。", "禁教令"], ["1637年に島原・天草地方で起こった一揆を何といいますか。", "島原・天草一揆"], ["島原・天草一揆の指導者となった人物は誰ですか。", "天草四郎（益田時貞）"], ["1641年、オランダ商館が移された長崎の人工島はどこですか。", "出島"], ["外国との交流や貿易を幕府が統制した体制を何といいますか。", "鎖国"], ["朝鮮から将軍の代替わりなどに派遣された使節を何といいますか。", "朝鮮通信使"], ["朝鮮との外交・貿易の窓口を担当した藩はどこですか。", "対馬藩"], ["琉球王国に侵攻した藩はどこですか。", "薩摩藩"], ["アイヌ民族との交易の窓口となった藩はどこですか。", "松前藩"], ["17世紀後半、松前藩に対して戦いを起こしたアイヌの指導者は誰ですか。", "シャクシャイン"], ["アイヌの人々が自然界のあらゆるものに宿ると考えた神を何といいますか。", "カムイ"], ["アイヌの人々が行った、熊を送る儀式を何といいますか。", "イオマンテ"], ["『アイヌ神謡集』を出版した人物は誰ですか。", "知里幸恵"], ["江戸時代の人口の多くを占め、農業などに従事した身分は何ですか。", "百姓"], ["村で百姓の代表的な役割を担った村役人を何といいますか。", "庄屋（名主）"], ["年貢の納入や犯罪防止などに連帯責任を負わせた制度は何ですか。", "五人組"], ["百姓が領主に納めた税を何といいますか。", "年貢"], ["脱穀を効率的に行うために使われた農具は何ですか。", "千歯こき"], ["いわしなどを原料として作られた肥料を何といいますか。", "干鰯（ほしか）"], ["18世紀初めごろまでに、教科書本文では耕地面積はおよそ何倍に増えたと説明されていますか。", "約2倍"], ["米以外に、商品として栽培された作物の例を一つ答えなさい。", "木綿・菜種など"], ["全国の産物が集まり、「天下の台所」と呼ばれた都市はどこですか。", "大阪"], ["将軍のおひざもとと呼ばれた政治の中心地はどこですか。", "江戸"], ["江戸時代の三都とは、江戸・大阪ともう一つはどこですか。", "京都"], ["大阪に各地の年貢米や特産物を集めた大名の倉庫を何といいますか。", "蔵屋敷"], ["江戸と京都を結ぶ、海沿いの主要街道は何ですか。", "東海道"], ["街道沿いに設けられ、旅人が宿泊や休憩をした場所を何といいますか。", "宿場町"], ["大阪から江戸へ酒を運んだ船を何といいますか。", "樽廻船"], ["大阪から江戸へ日用品などを運んだ船を何といいますか。", "菱垣廻船"], ["江戸と京都・大阪などを結ぶ主要な五つの街道をまとめて何といいますか。", "五街道"], ["幕府が街道に設け、人々の通行を監視した施設は何ですか。", "関所"], ["1716年ごろに始まった享保の改革を行った将軍は誰ですか。", "徳川吉宗"], ["庶民の意見を聞くため、徳川吉宗が設置した箱を何といいますか。", "目安箱"], ["裁判の基準を定めるため、徳川吉宗が制定した法令は何ですか。", "公事方御定書"], ["大名に米を納めさせる代わりに参勤交代の負担を軽くした政策は何ですか。", "上げ米"], ["商業を重視し、株仲間を奨励した政治家は誰ですか。", "田沼意次"], ["1787年ごろから寛政の改革を行った人物は誰ですか。", "松平定信"], ["寛政の改革で、旗本や御家人の借金を整理した法令は何ですか。", "棄捐令"], ["寛政の改革で、飢饉に備えて米を蓄えさせた政策は何ですか。", "囲米"], ["寛政の改革で、幕府の学問所で朱子学以外を制限した政策は何ですか。", "寛政異学の禁"], ["1841年ごろから天保の改革を行った人物は誰ですか。", "水野忠邦"], ["天保の改革で、商人の同業者組織を解散させた政策は何ですか。", "株仲間の解散"], ["天保の改革で、江戸・大阪周辺の土地を幕府直轄地にしようとした政策は何ですか。", "上知令"], ["1792年に根室に来航したロシアの使節は誰ですか。", "ラクスマン"], ["1804年に長崎に来航したロシアの使節は誰ですか。", "レザノフ"], ["1825年に幕府が出した、外国船を追い払う命令は何ですか。", "異国船打払令"], ["外国船に燃料や水・食料を与えるようにした幕府の方針を何といいますか。", "薪水給与令"], ["1853年に浦賀へ黒船を率いて来航したアメリカの使節は誰ですか。", "ペリー"], ["ペリー来航の翌年、1854年に結ばれた条約は何ですか。", "日米和親条約"], ["国学を大成し、『古事記伝』を著した人物は誰ですか。", "本居宣長"], ["『解体新書』の翻訳に関わった人物を一人答えなさい。", "杉田玄白・前野良沢"], ["全国を測量し、正確な日本地図を作った人物は誰ですか。", "伊能忠敬"], ["17世紀後半から18世紀初めに、上方を中心に栄えた文化を何といいますか。", "元禄文化"], ["『奥の細道』を著した俳人は誰ですか。", "松尾芭蕉"], ["『日本永代蔵』などを著した浮世草子の作家は誰ですか。", "井原西鶴"], ["人形浄瑠璃などの作品で知られる作家は誰ですか。", "近松門左衛門"], ["『見返り美人図』を描いた浮世絵師は誰ですか。", "菱川師宣"], ["19世紀初めに江戸を中心に栄えた文化を何といいますか。", "化政文化"], ["『富嶽三十六景』を描いた浮世絵師は誰ですか。", "葛飾北斎"], ["『東海道五十三次』を描いた浮世絵師は誰ですか。", "歌川広重"], ["『東海道中膝栗毛』を著した人物は誰ですか。", "十返舎一九"], ["『南総里見八犬伝』を著した人物は誰ですか。", "滝沢馬琴"], ["江戸時代に農業以外で発達した、木材を生産・利用する産業は何ですか。", "林業"], ["新潟県にあった、金の産出で知られる鉱山は何ですか。", "佐渡金山"], ["島根県にあった、銀の産出で知られる鉱山は何ですか。", "石見銀山"], ["愛媛県にあった、銅の産出で知られる鉱山は何ですか。", "別子銅山"], ["大阪から江戸へ物資を運ぶ海上輸送が発達したことで、何が発展しましたか。", "海運・港町"], ["日本海側から瀬戸内海を通って大阪へ向かう航路を何といいますか。", "西廻り航路"], ["東北地方や北海道方面から太平洋側を通って江戸へ向かう航路を何といいますか。", "東廻り航路"], ["アイヌ民族との交易で、松前藩が独占を認められたのは何年ですか。", "1604年"], ["薩摩藩が琉球王国に侵攻したのは何年ですか。", "1609年"], ["スペイン船の来航が禁止されたのは何年ですか。", "1624年"], ["日本人の海外渡航と帰国が禁止されたのは何年ですか。", "1635年"], ["ポルトガル船の来航が禁止されたのは何年ですか。", "1639年"], ["幕府がオランダ商館を出島に移したのは何年ですか。", "1641年"], ["徳川吉宗が行った改革を何といいますか。", "享保の改革"], ["松平定信が行った改革を何といいますか。", "寛政の改革"], ["水野忠邦が行った改革を何といいますか。", "天保の改革"], ["田沼意次の政治で奨励された、商工業者の同業者組織を何といいますか。", "株仲間"], ["武士や町人とは異なる身分として差別された人々には、どのような身分がありましたか。", "えた身分・ひにん身分"], ["長崎でオランダや中国との貿易を管理した幕府の役所は何ですか。", "長崎奉行所"], ["江戸時代に日本から輸出された金属の代表例を一つ答えなさい。", "銀・銅"], ["元禄文化が主に栄えた地域は、江戸と上方のどちらですか。", "上方（大阪・京都）"]];let index=0,revealed=false,marks=Array(questions.length).fill("");
const $=id=>document.getElementById(id);
function screen(which){["start","quiz","finish"].forEach(x=>$(x).classList.toggle("hidden",x!==which))}
function render(){const q=questions[index];$("num").textContent=index+1;$("question").textContent=q[0];$("answer").textContent=q[1];$("answer").classList.toggle("hidden",!revealed);$("show").classList.toggle("hidden",revealed);$("mark").classList.toggle("hidden",!revealed);$("next").classList.toggle("hidden",!revealed);$("next").textContent=index===questions.length-1?"結果を見る →":"次の問題へ →";$("prev").disabled=index===0;$("knownCount").textContent=marks.filter(x=>x==="known").length;$("reviewCount").textContent=marks.filter(x=>x==="review").length;$("bar").style.width=((index+(revealed?1:0))/questions.length*100)+"%"}
function start(){index=0;revealed=false;marks=Array(questions.length).fill("");screen("quiz");render()}
$("begin").onclick=start;$("show").onclick=()=>{revealed=true;render()};$("remember").onclick=()=>{marks[index]="known";render()};$("again").onclick=()=>{marks[index]="review";render()};
$("next").onclick=()=>{if(index===questions.length-1)finish();else{index++;revealed=false;render()}};$("prev").onclick=()=>{if(index>0){index--;revealed=false;render()}};
$("restart").onclick=()=>{if(confirm("最初からやり直しますか？学習記録はリセットされます。"))start()};
function finish(){screen("finish");const k=marks.filter(x=>x==="known").length,r=marks.filter(x=>x==="review").length;$("score").textContent=k+" / "+questions.length;$("knownFinal").textContent=k;$("reviewFinal").textContent=r}
$("retry").onclick=start;
</script></body></html>
